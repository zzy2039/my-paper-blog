<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">从现实问题到求解结果</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54746c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#213b34"><text x="40" y="47" font-size="25" font-weight="700">从现实问题到求解结果</text><text x="40" y="81" font-size="16" fill="#536963">以本指南工厂生产模型为例：先明确决策，再写约束，最后核验输出。</text><path d="M300 206 L370 206" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 206 L700 206" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830 272 L630 350" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="140" width="260" height="132" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="170.0" y="171" text-anchor="middle" font-size="18" font-weight="700">① 现实决策</text><text x="170.0" y="198" text-anchor="middle" font-size="16" font-weight="400">生产多少件 A、B？</text><text x="170.0" y="225" text-anchor="middle" font-size="16" font-weight="400">每类产品数量必须为整数</text><rect x="370" y="140" width="260" height="132" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="500.0" y="171" text-anchor="middle" font-size="18" font-weight="700">② 数学建模</text><text x="500.0" y="198" text-anchor="middle" font-size="16" font-weight="400">max 3x + 2y</text><text x="500.0" y="225" text-anchor="middle" font-size="16" font-weight="400">资源约束 + 非负整数条件</text><rect x="700" y="140" width="260" height="132" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="830.0" y="171" text-anchor="middle" font-size="18" font-weight="700">③ 求解器搜索</text><text x="830.0" y="198" text-anchor="middle" font-size="16" font-weight="400">LP 松弛、分支、割平面</text><text x="830.0" y="225" text-anchor="middle" font-size="16" font-weight="400">寻找可行解并改善界</text><rect x="370" y="350" width="260" height="100" rx="12" fill="#fff5dc" stroke="#a6bdb4"/><text x="500.0" y="381" text-anchor="middle" font-size="18" font-weight="700">④ 检查输出</text><text x="500.0" y="408" text-anchor="middle" font-size="16" font-weight="400">可行性 · 目标值 · 最优性 gap</text><text x="40" y="495" font-size="14" fill="#6a7e77">教学补充示意图 · 非原论文图</text></g></svg>