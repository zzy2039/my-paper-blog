<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">机器学习如何参与求解</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54746c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#213b34"><text x="40" y="47" font-size="25" font-weight="700">机器学习如何参与求解</text><text x="40" y="81" font-size="16" fill="#536963">模型提出搜索建议；求解器执行运算并检查约束。</text><path d="M300 206 L370 206" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 206 L700 206" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="140" width="260" height="132" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="170.0" y="171" text-anchor="middle" font-size="18" font-weight="700">① 输入求解状态</text><text x="170.0" y="198" text-anchor="middle" font-size="16" font-weight="400">变量与约束、LP 解</text><text x="170.0" y="225" text-anchor="middle" font-size="16" font-weight="400">搜索树信息、历史数据</text><rect x="370" y="140" width="260" height="132" rx="12" fill="#e8eff9" stroke="#a6bdb4"/><text x="500.0" y="171" text-anchor="middle" font-size="18" font-weight="700">② 学习模型给出建议</text><text x="500.0" y="198" text-anchor="middle" font-size="16" font-weight="400">分支变量 / 节点 / 割排序</text><text x="500.0" y="225" text-anchor="middle" font-size="16" font-weight="400">初始解 / 搜索邻域</text><rect x="700" y="140" width="260" height="132" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="830.0" y="171" text-anchor="middle" font-size="18" font-weight="700">③ 求解器执行与检查</text><text x="830.0" y="198" text-anchor="middle" font-size="16" font-weight="400">求解 LP 或子 MIP</text><text x="830.0" y="225" text-anchor="middle" font-size="16" font-weight="400">检查可行性并更新界</text><rect x="210" y="350" width="580" height="100" rx="12" fill="#fff5dc" stroke="#a6bdb4"/><text x="500.0" y="381" text-anchor="middle" font-size="18" font-weight="700">保证来自算法条件</text><text x="500.0" y="408" text-anchor="middle" font-size="16" font-weight="400">只调整搜索顺序通常可保留精确框架；</text><text x="500.0" y="435" text-anchor="middle" font-size="16" font-weight="400">任意预测剪枝、提前停止不自动保留最优性保证。</text><text x="40" y="495" font-size="14" fill="#6a7e77">教学补充示意图 · 非原论文图</text></g></svg>