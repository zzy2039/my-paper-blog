<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">分支定界：用上界排除无望分支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#54746c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#213b34"><text x="40" y="47" font-size="25" font-weight="700">分支定界：用上界排除无望分支</text><text x="40" y="81" font-size="16" fill="#536963">最大化 3x + 2y；2x + y ≤ 4，x + 2y ≤ 4；x、y 为非负整数。</text><path d="M400 230 L255 320" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="337.5" y="267.0" font-size="15">x ≤ 1</text><path d="M600 230 L745 320" stroke="#54746c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="682.5" y="267.0" font-size="15">x ≥ 2</text><rect x="325" y="120" width="350" height="110" rx="12" fill="#eef5f2" stroke="#a6bdb4"/><text x="500.0" y="151" text-anchor="middle" font-size="18" font-weight="700">根节点 LP 松弛</text><text x="500.0" y="178" text-anchor="middle" font-size="16" font-weight="400">x = y = 4/3</text><text x="500.0" y="205" text-anchor="middle" font-size="16" font-weight="400">上界 UB = 20/3 ≈ 6.67</text><rect x="60" y="320" width="390" height="130" rx="12" fill="#fff5dc" stroke="#a6bdb4"/><text x="255.0" y="351" text-anchor="middle" font-size="18" font-weight="700">左分支：x ≤ 1</text><text x="255.0" y="378" text-anchor="middle" font-size="16" font-weight="400">LP 最优 (1, 1.5)，UB = 6</text><text x="255.0" y="405" text-anchor="middle" font-size="16" font-weight="400">已有整数解值为 6，可按界剪枝</text><rect x="550" y="320" width="390" height="130" rx="12" fill="#e4f3e9" stroke="#a6bdb4"/><text x="745.0" y="351" text-anchor="middle" font-size="18" font-weight="700">右分支：x ≥ 2</text><text x="745.0" y="378" text-anchor="middle" font-size="16" font-weight="400">LP 最优 (2, 0)，目标值 = 6</text><text x="745.0" y="405" text-anchor="middle" font-size="16" font-weight="400">解为整数，更新当前最好解</text><text x="40" y="505" font-size="14" fill="#6a7e77">教学补充 · 先探索右分支；最后全局上、下界均为 6，证明最优。</text></g></svg>