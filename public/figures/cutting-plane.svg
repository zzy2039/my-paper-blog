<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">割平面的几何作用</title><desc id="desc">自编二元例子：松弛区域x+y≥1.5的三角形，被有效割x+y≥2收紧为整数点(1,1)。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17243b} .small{font-size:16px}.body{font-size:19px}.label{font-size:21px;font-weight:600}.title{font-size:28px;font-weight:700}</style>
<rect width="1200" height="620" fill="white"/>
<text x="35" y="45" class="title">06  有效割：去掉分数解，保留全部整数可行解</text>
<text x="55" y="100" class="label">LP 松弛：x + y ≥ 1.5</text>
<line x1="100" y1="470" x2="390" y2="470" stroke="#dbe3ed" stroke-width="1"/>
<line x1="100" y1="470" x2="100" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="80" y="476" class="small" style="fill:#53657e" text-anchor="end">0</text>
<text x="100" y="495" class="small" style="fill:#53657e" text-anchor="middle">0</text>
<line x1="100" y1="325.0" x2="390" y2="325.0" stroke="#dbe3ed" stroke-width="1"/>
<line x1="245.0" y1="470" x2="245.0" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="80" y="331.0" class="small" style="fill:#53657e" text-anchor="end">0.5</text>
<text x="245.0" y="495" class="small" style="fill:#53657e" text-anchor="middle">0.5</text>
<line x1="100" y1="180" x2="390" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<line x1="390" y1="470" x2="390" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="80" y="186" class="small" style="fill:#53657e" text-anchor="end">1</text>
<text x="390" y="495" class="small" style="fill:#53657e" text-anchor="middle">1</text>
<line x1="100" y1="470" x2="477.0" y2="470" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="100" y1="470" x2="100" y2="136.5" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="479.90000000000003" y="470" class="body">x</text>
<text x="100" y="122.0" class="body">y</text>
<polygon points="245.0,180 390,325.0 390,180" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="390" cy="180" r="8" fill="#047857" stroke="white" stroke-width="2"/>
<text x="404" y="188" class="small" style="fill:#047857">(1, 1)</text>
<text x="55" y="535" class="body" style="fill:#2563eb">最优值：1.5；边界上含分数最优解</text>
<text x="645" y="100" class="label">加入割后：x + y ≥ 2</text>
<line x1="690" y1="470" x2="980" y2="470" stroke="#dbe3ed" stroke-width="1"/>
<line x1="690" y1="470" x2="690" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="670" y="476" class="small" style="fill:#53657e" text-anchor="end">0</text>
<text x="690" y="495" class="small" style="fill:#53657e" text-anchor="middle">0</text>
<line x1="690" y1="325.0" x2="980" y2="325.0" stroke="#dbe3ed" stroke-width="1"/>
<line x1="835.0" y1="470" x2="835.0" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="670" y="331.0" class="small" style="fill:#53657e" text-anchor="end">0.5</text>
<text x="835.0" y="495" class="small" style="fill:#53657e" text-anchor="middle">0.5</text>
<line x1="690" y1="180" x2="980" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<line x1="980" y1="470" x2="980" y2="180" stroke="#dbe3ed" stroke-width="1"/>
<text x="670" y="186" class="small" style="fill:#53657e" text-anchor="end">1</text>
<text x="980" y="495" class="small" style="fill:#53657e" text-anchor="middle">1</text>
<line x1="690" y1="470" x2="1067.0" y2="470" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="690" y1="470" x2="690" y2="136.5" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1069.9" y="470" class="body">x</text>
<text x="690" y="122.0" class="body">y</text>
<polygon points="835.0,180 980,325.0 980,180" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="755" y="400" class="small" style="fill:#53657e">蓝区被切除，仅保留绿点</text>
<line x1="936.5" y1="136.5" x2="1023.5" y2="223.5" stroke="#b45309" stroke-width="4"/>
<text x="835" y="120" class="small" style="fill:#b45309">x + y = 2</text>
<circle cx="980" cy="180" r="8" fill="#047857" stroke="white" stroke-width="2"/>
<text x="994" y="188" class="small" style="fill:#047857">(1, 1)</text>
<text x="645" y="535" class="body" style="fill:#047857">最优值：2；只有 (1, 1) 可行</text>
<text x="35" y="590" class="body" style="fill:#53657e">整数推理：x + y 是整数且 ≥ 1.5，所以必有 x + y ≥ 2。目标为 min x + y。</text>
</svg>