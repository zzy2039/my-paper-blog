<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">机器学习辅助求解器的概念架构</title><desc id="desc">离线通过历史实例与轨迹训练模型；在线模型读取状态并建议动作，求解器执行合法操作并反馈状态。有效界与可行性检查是单独的数学职责。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
