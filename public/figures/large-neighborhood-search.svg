<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">大邻域搜索</title><desc id="desc">教学背包例子：容量5，重量4,3,2,2，收益7,6,4,3。扩大释放变量集合可找到更优解。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17243b} .small{font-size:16px}.body{font-size:19px}.label{font-size:21px;font-weight:600}.title{font-size:28px;font-weight:700}</style>
<rect width="1200" height="650" fill="white"/>
<text x="35" y="45" class="title">07  大邻域搜索：固定一部分，重新优化一部分</text>
<text x="35" y="85" class="body" style="fill:#53657e">容量 5  |  重量 (4, 3, 2, 2)  |  收益 (7, 6, 4, 3)</text>
<rect x="35" y="130" width="330" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="51" y="158" class="label">1  当前可行解 1000</text>
<text x="51" y="185" class="small" style="fill:#53657e">重量 4，收益 7</text>
<text x="51" y="210" class="small" style="fill:#53657e">选择要释放的变量集合 F</text>
<rect x="435" y="130" width="330" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="451" y="158" class="label">2  构造并求解子问题</text>
<text x="451" y="185" class="small" style="fill:#53657e">固定 F 之外的变量</text>
<text x="451" y="210" class="small" style="fill:#53657e">对子问题设置计算预算</text>
<rect x="835" y="130" width="330" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="851" y="158" class="label">3  验证与更新</text>
<text x="851" y="185" class="small" style="fill:#53657e">只接受满足原约束的解</text>
<text x="851" y="210" class="small" style="fill:#53657e">保留更优解，然后重复</text>
<line x1="365" y1="180" x2="425" y2="180" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="765" y1="180" x2="825" y2="180" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="285" width="540" height="225" rx="14" fill="#fff7ed" stroke="#dbe3ed"/>
<text x="55" y="325" class="label" style="fill:#b45309">小邻域 F = {2, 3}</text>
<text x="55" y="370" class="body">固定 x₁ = 1，x₄ = 0；剩余容量仅 1。</text>
<text x="55" y="410" class="body">物品 2、3 都放不进去。</text>
<text x="55" y="465" class="body" style="fill:#b45309">结果：1000，收益仍为 7。</text>
<rect x="625" y="285" width="540" height="225" rx="14" fill="#ecfdf5" stroke="#dbe3ed"/>
<text x="645" y="325" class="label" style="fill:#047857">大邻域 F = {1, 2, 3}</text>
<text x="645" y="370" class="body">只固定 x₄ = 0；允许移除物品 1。</text>
<text x="645" y="410" class="body">选择物品 2、3：重量 3 + 2 = 5。</text>
<text x="645" y="465" class="body" style="fill:#047857">结果：0110，收益提升到 10。</text>
<text x="35" y="567" class="body">1000 → 0110 的汉明距离为 3；只允许改变 2 个位置的邻域找不到这个解。</text>
<text x="35" y="610" class="body" style="fill:#53657e">机器学习可选择释放集合；子问题求解与原模型可行性检查仍由求解器负责。</text>
</svg>