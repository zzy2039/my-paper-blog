<rect x="795.0" y="414.0" width="70" height="28" rx="14" fill="white" stroke="white"/>
<text x="830.0" y="435.0" class="small" style="fill:#17243b" text-anchor="middle">x ≤ 1</text>
<line x1="900" y1="390" x2="1040" y2="465" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="935.0" y="414.0" width="70" height="28" rx="14" fill="white" stroke="white"/>
<text x="970.0" y="435.0" class="small" style="fill:#17243b" text-anchor="middle">x ≥ 2</text>
<line x1="760" y1="570" x2="620" y2="645" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655.0" y="594.0" width="70" height="28" rx="14" fill="white" stroke="white"/>
<text x="690.0" y="615.0" class="small" style="fill:#17243b" text-anchor="middle">y ≤ 2</text>
<line x1="760" y1="570" x2="900" y2="645" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795.0" y="594.0" width="70" height="28" rx="14" fill="white" stroke="white"/>
<text x="830.0" y="615.0" class="small" style="fill:#17243b" text-anchor="middle">y ≥ 3</text>
<rect x="470" y="110" width="240" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="486" y="138" class="label">A</text>
<text x="486" y="165" class="small" style="fill:#53657e">(5/2, 3/2)</text>
<text x="486" y="190" class="small" style="fill:#53657e">L = −13/2</text>
<rect x="160" y="290" width="240" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="176" y="318" class="label">B</text>
<text x="176" y="345" class="small" style="fill:#53657e">(5/3, 1)</text>
<text x="176" y="370" class="small" style="fill:#53657e">L = −13/3</text>
<rect x="780" y="290" width="240" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="796" y="318" class="label">C</text>
<text x="796" y="345" class="small" style="fill:#53657e">(5/3, 2)</text>
<text x="796" y="370" class="small" style="fill:#53657e">L = −16/3</text>
<rect x="20" y="470" width="240" height="100" rx="14" fill="#ecfdf5" stroke="#dbe3ed"/>
<text x="36" y="498" class="label">D</text>
<text x="36" y="525" class="small" style="fill:#53657e">(1, 1) · 整数解</text>
<text x="36" y="550" class="small" style="fill:#53657e">L = −3 → U = −3</text>
<rect x="300" y="470" width="240" height="100" rx="14" fill="#fff7ed" stroke="#dbe3ed"/>
<text x="316" y="498" class="label">E</text>
<text x="316" y="525" class="small" style="fill:#53657e">LP 不可行</text>
<text x="316" y="550" class="small" style="fill:#53657e">不可行剪枝</text>
<rect x="640" y="470" width="240" height="100" rx="14" fill="#eff6ff" stroke="#dbe3ed"/>
<text x="656" y="498" class="label">F</text>
<text x="656" y="525" class="small" style="fill:#53657e">(1, 12/5)</text>
<text x="656" y="550" class="small" style="fill:#53657e">L = −22/5</text>
<rect x="920" y="470" width="240" height="100" rx="14" fill="#fff7ed" stroke="#dbe3ed"/>
<text x="936" y="498" class="label">G</text>
<text x="936" y="525" class="small" style="fill:#53657e">LP 不可行</text>
<text x="936" y="550" class="small" style="fill:#53657e">不可行剪枝</text>
<rect x="500" y="650" width="240" height="100" rx="14" fill="#ecfdf5" stroke="#dbe3ed"/>
<text x="516" y="678" class="label">H</text>
<text x="516" y="705" class="small" style="fill:#53657e">(1, 2) · 整数解</text>
<text x="516" y="730" class="small" style="fill:#53657e">L = −4 → U = −4</text>
<rect x="780" y="650" width="240" height="100" rx="14" fill="#fff7ed" stroke="#dbe3ed"/>
<text x="796" y="678" class="label">I</text>
<text x="796" y="705" class="small" style="fill:#53657e">(0, 3) · L = −3</text>
<text x="796" y="730" class="small" style="fill:#53657e">L ≥ U = −4，界剪枝</text>
<text x="35" y="800" class="body">访问顺序：A → B → D → E → C → F → H → I → G</text>
<text x="35" y="836" class="body" style="fill:#047857">蓝：分支   绿：整数解   橙：剪枝   |   U：+∞ → −3 → −4；最终 L = U = −4</text>
</svg>